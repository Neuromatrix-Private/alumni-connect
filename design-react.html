function App() {
  // --- NAVIGATION & DROPDOWN STATE ---
  const [openDropdown, setOpenDropdown] = useState(null);
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

  // --- HERO VINTAGE PHOTO EXPLORER STATE ---
  const [photoExplorerMode, setPhotoExplorerMode] = useState(false);
  const [activeHotspot, setActiveHotspot] = useState(VINTAGE_PHOTO_HOTSPOTS[0]);

  // --- STUDIO VOICE NOTE PLAYER STATE (0:00 to 1:09 = 69 seconds) ---
  const TOTAL_DURATION = 69;
  const [isPlayingAudio, setIsPlayingAudio] = useState(false);
  const [audioSeconds, setAudioSeconds] = useState(0);
  const [playbackRate, setPlaybackRate] = useState(1);
  const [isMuted, setIsMuted] = useState(false);
  const audioCtxRef = useRef(null);

  // --- INTERACTIVE 4-PILLAR HUB STATE ---
  const [activePillarTab, setActivePillarTab] = useState('alumni'); // 'alumni' | 'memory' | 'giveback' | 'events'
  const [alumniSubFilter, setAlumniSubFilter] = useState('All'); // 'All' | 'Navratna' | 'Shining Star' | 'Steward'
  const [alumniSearchQuery, setAlumniSearchQuery] = useState('');
  const [memoryCategoryFilter, setMemoryCategoryFilter] = useState('All');
  const [memoriesList, setMemoriesList] = useState(MEMORY_CHEST_ITEMS);
  const [giveBackSubTab, setGiveBackSubTab] = useState('corpus'); // 'corpus' | 'wishlist' | 'sangamam' | 'careers'
  const [selectedCorpusAmount, setSelectedCorpusAmount] = useState(25000);
  const [corpusPledgeSubmitted, setCorpusPledgeSubmitted] = useState(false);
  const [rsvpSubmitted, setRsvpSubmitted] = useState(false);

  // --- INSTITUTIONS FILTER STATE ---
  const [instCategoryTab, setInstCategoryTab] = useState('All'); // 'All' | 'Established' | 'Futuristic' | 'Upcoming'
  const [instCampusFilter, setInstCampusFilter] = useState('All'); // 'All' | 'Matunga' | 'Sion' | 'Ghatkopar' | 'Nerul'
  const [instSearch, setInstSearch] = useState('');
  const [selectedInstitutionModal, setSelectedInstitutionModal] = useState(null);

  // --- MODALS STATE ---
  const [profileModalOpen, setProfileModalOpen] = useState(false);
  const [addMemoryModalOpen, setAddMemoryModalOpen] = useState(false);
  const [toastNotification, setToastNotification] = useState(null);

  // --- ADD MEMORY FORM STATE ---
  const [newMemoryForm, setNewMemoryForm] = useState({
    title: '',
    category: 'Unforgettable Mentors',
    era: '',
    campus: 'Sion West Campus',
    summary: '',
    contributor: ''
  });

  // --- PROFILE DIGITAL ID FORM STATE ---
  const [alumniProfile, setAlumniProfile] = useState({
    name: 'Arjun Krishnamurthy',
    batch: '2004',
    institution: 'SIES College of Arts, Science & Commerce, Sion (W)',
    membershipId: 'SIES-ALM-1932-08421',
    location: 'Mumbai, India',
    profession: 'Principal Architect & Urban Planner',
    bloodGroup: 'O+',
    verified: true
  });

  // Helper to show non-intrusive toast message
  const triggerToast = (title, subtitle) => {
    setToastNotification({ title, subtitle });
    setTimeout(() => {
      setToastNotification(null);
    }, 4200);
  };

  // --- AUDIO PLAYER SIMULATION + GENTLE WEB AUDIO CHIME ---
  const playGentleHarmonicChime = () => {
    if (isMuted) return;
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      if (!audioCtxRef.current) {
        audioCtxRef.current = new AudioContextClass();
      }
      const ctx = audioCtxRef.current;
      if (ctx.state === 'suspended') {
        ctx.resume();
      }
      const now = ctx.currentTime;
      const notes = [261.63, 329.63, 392.0, 523.25]; // Warm C major tanpura-inspired chord
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
        gain.gain.setValueAtTime(0.001, now + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.04, now + idx * 0.08 + 0.15);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 1.8);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.08);
        osc.stop(now + idx * 0.08 + 1.9);
      });
    } catch (e) {
      // Ignore audio context restrictions if blocked
    }
  };

  useEffect(() => {
    let interval = null;
    if (isPlayingAudio) {
      interval = setInterval(() => {
        setAudioSeconds((prev) => {
          if (prev >= TOTAL_DURATION) {
            setIsPlayingAudio(false);
            return 0;
          }
          return Math.min(TOTAL_DURATION, +(prev + 0.25 * playbackRate).toFixed(2));
        });
      }, 250);
    }
    return () => {
      if (interval) clearInterval(interval);
    };
  }, [isPlayingAudio, playbackRate]);

  const togglePlayAudio = () => {
    if (!isPlayingAudio) {
      playGentleHarmonicChime();
    }
    setIsPlayingAudio(!isPlayingAudio);
  };

  const formatTime = (sec) => {
    const whole = Math.floor(sec);
    const m = Math.floor(whole / 60);
    const s = whole % 60;
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  };

  // --- SMOOTH SCROLL & PILLAR NAVIGATION HANDLER ---
  const navigateToSection = (sectionId, options = {}) => {
    setOpenDropdown(null);
    setMobileMenuOpen(false);

    if (options.openProfile) {
      setProfileModalOpen(true);
      return;
    }
    if (options.openAddMemory) {
      setAddMemoryModalOpen(true);
      return;
    }
    if (options.pillarTab) {
      setActivePillarTab(options.pillarTab);
    }
    if (options.alumniFilter) {
      setAlumniSubFilter(options.alumniFilter);
    }
    if (options.memoryFilter) {
      setMemoryCategoryFilter(options.memoryFilter);
    }
    if (options.giveBackTab) {
